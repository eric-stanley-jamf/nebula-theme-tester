<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Theme Tester</title>
    <!-- Prevent flash of wrong theme by resolving before React renders -->
    <script>
      (function () {
        var colorMode    = localStorage.getItem('nebula-color-mode') || 'system';
        var contrastMode = localStorage.getItem('nebula-contrast-mode') || 'manual';
        var manualHC     = localStorage.getItem('nebula-high-contrast') === 'true';
        var hc = contrastMode === 'system'
          ? window.matchMedia('(prefers-contrast: more)').matches
          : manualHC;
        // System color + no high contrast: let CSS prefers-color-scheme handle it
        if (colorMode === 'system' && !hc) return;
        var base = colorMode === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : colorMode;
        document.documentElement.setAttribute('data-theme', hc ? base + '-accessible' : base);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
