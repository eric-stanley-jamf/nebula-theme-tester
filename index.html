<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Theme Tester</title>
    <!-- Prevent flash of wrong theme by resolving before React renders -->
    <script>
      (function () {
        var mode = localStorage.getItem('nebula-color-mode') || 'system';
        var hc = localStorage.getItem('nebula-high-contrast') === 'true';
        var base =
          mode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.documentElement.setAttribute(
          'data-theme',
          hc ? base + '-accessible' : base
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
